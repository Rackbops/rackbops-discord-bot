name: push-notify

# Post one Discord notification per push to main (as Github-Repo-Updates), via the
# shared reusable workflow in roshne/addon-ci. Because this repo squash-merges, a push
# to main IS a merged PR -- so this is "tell me when a PR lands", one message per merge.
#
# Triggers on main ONLY: a feature-branch push posts nothing, and the branch push plus
# its squash-merge can't double-post (the failure the native webhook had -- roshne/Tooling#111).
#
# addon-ci stays on roshne deliberately -- it is a PUBLIC reusable-workflow library, and
# calling it across owners is fine (see Rackbops/Tooling#310).
#
# DISCORD_PUSH_WEBHOOK is passed EXPLICITLY, never via `secrets: inherit`. This is
# load-bearing: Rackbops is a FREE org, so a PRIVATE repo cannot access org-level
# secrets -- but `inherit` still resolves the name to that inaccessible ORG secret and
# passes an empty string, SHADOWING the repo-level secret that would have worked. The
# reusable workflow then skips GREEN, so nothing fails and no notification is sent.
# Explicit passing evaluates in this repo's own context, which resolves repo-level
# first and falls back to org-level -- correct for private and public repos alike.
# Diagnosed 2026-09-02 on Rackbops/the-keeper#5. The reusable workflow still skips
# green when the secret is genuinely unset, so this file is harmless in a fork.
on:
  push:
    branches: [main]
    # Pushes that are *only* bookkeeping don't earn a Discord post. GitHub skips the
    # whole workflow (no runner, no billed minute) when EVERY path in the push matches;
    # a push mixing one of these with real code still notifies -- the filter mutes noise,
    # it never hides a code change.
    # CLAUDE.md is deliberately NOT here: it steers Claude, so it's behaviour, not prose.
    # paths-ignore can't carry an exception, so the doc files are enumerated by name
    # rather than glob **/*.md.
    paths-ignore:
      - '**/README.md'          # `**/` matches a root README.md too
      - '**/CONTRIBUTING.md'
      - '**/CONTEXT.md'
      - 'docs/**'               # the docs tree, incl. non-md assets

jobs:
  notify:
    # Pinned to a commit, not `@main` (#61). This is a CROSS-OWNER reusable workflow that runs in
    # THIS repo's context with DISCORD_PUSH_WEBHOOK, so at `@main` whatever addon-ci's default
    # branch happened to hold at run time would execute with that secret, with nothing in this
    # repo's history recording the change. The pin is what closes that; `permissions:` below does
    # NOT -- the secret is passed explicitly regardless of token scopes.
    #
    # The `# main` comment is load-bearing, not decoration: Renovate reads the first token after
    # `#` as the ref to track, and drops the dependency entirely if it can't parse one. Keep the
    # ref first and any prose here, so digest bumps keep arriving (Dependency Dashboard #150).
    # addon-ci cuts no tags today; if it ever does, re-pin to `@v<n>` and change the comment to
    # match. The pinned commit is byte-identical to the 2026-09-02 state of this workflow file.
    uses: roshne/addon-ci/.github/workflows/push-notify.yml@d609b00bcdaa7efc16536ec4f5f5e07caa9cbbdc # main
    # The called workflow needs no GITHUB_TOKEN at all: it checks nothing out, calls no GitHub
    # API, and only reads `github.event.*` before curling Discord. A called workflow inherits the
    # caller job's permissions and can only reduce them, so an empty set is the tightest correct
    # posture. If addon-ci ever adds a checkout it fails LOUDLY here (403), which is the outcome
    # we want from a workflow whose other failure modes are deliberately silent.
    permissions: {}
    secrets:
      DISCORD_PUSH_WEBHOOK: ${{ secrets.DISCORD_PUSH_WEBHOOK }}
