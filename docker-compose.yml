services:
  bot:
    build:
      # Defaults to the local checkout, unchanged for `docker compose up -d --build` here.
      # A deployed instance instead supplies BOT_BUILD_CONTEXT as a shell var on the build
      # invocation itself (e.g. https://github.com/Rackbops/rackbops-discord-bot.git#main) so the
      # daemon fetches and builds the source itself — no checkout needed on that host at all.
      # NOT persisted in .env: nothing rebuilds via `docker compose --build` after the initial
      # bring-up (self-update's own rebuilds go through the Docker Engine API directly, in
      # src/redeploy.ts, independent of this file). See ops/install.sh and ops/README.md.
      context: ${BOT_BUILD_CONTEXT:-.}
      args:
        # Pass the commit so the bot can tell when it's stale. In a local checkout:
        #   GIT_SHA=$(git rev-parse HEAD) docker compose up -d --build
        # With no checkout (BOT_BUILD_CONTEXT set to a remote), resolve it instead via:
        #   GIT_SHA=$(git ls-remote <repo-url> refs/heads/<branch> | cut -f1)
        GIT_SHA: ${GIT_SHA:-}
    # Defaults match the historical single-instance name; a deployed instance sets
    # BOT_OPS_CONTAINER (already used by ops/bot-ops.sh) so debug and prod never collide
    # on the same host.
    container_name: ${BOT_OPS_CONTAINER:-warbandeer-discord}
    # Defaults to a file beside this compose file (local dev, unchanged). A deployed
    # instance's config dir lives elsewhere (/opt/rackbops-discord-bot/<instance>/.env,
    # see ops/README.md), so ops/bot-ops.sh and ops/install.sh both export BOT_ENV_FILE
    # to point here at its absolute path.
    env_file: ${BOT_ENV_FILE:-.env}
    volumes:
      - state:/app/data
      # Self-update (#879): the bot builds its own replacement and hands off to it through the
      # daemon. This is root-equivalent on the host — accepted deliberately, because it is the
      # only way `/update` completes with nothing installed outside the container. The trigger
      # stays ADMIN_USER_IDS-gated and fails closed.
      - /var/run/docker.sock:/var/run/docker.sock
    # Started as root so the entrypoint can read the socket's group off the socket itself —
    # it is mode 0660 root:docker and the docker group's GID differs per host (115 here, 999
    # on a stock Debian), so naming one would be exactly the operator-supplied config this
    # design rules out. The entrypoint immediately drops to `bun` carrying that one group;
    # root never survives past its first exec. Security-wise this changes nothing either way:
    # the socket mount above is already root-equivalent on the host.
    user: "0:0"
    restart: unless-stopped
    init: true

  # Opt-in, deploy-only (needs BOT_OPS_CONFIG_DIR/BOT_OPS_COMPOSE_FILE pointed at real /opt/...
  # paths — see ops/install.sh, which generates them; not meant for local dev). A small
  # per-instance admin web panel, a thin wrapper around ops/bot-ops.sh's five operations. Runs
  # as its own sidecar (independent of the bot process's lifecycle) with no published host
  # port — reached over the network via nucbox's own pre-existing, host-level Cloudflare tunnel
  # (an ingress rule pointed at this service, external to this compose file), gated by Cloudflare
  # Access — NOT via the `cloudflared` sidecar below, which is a separate, opt-in tunnel
  # dedicated to WARBANDEER_INGEST_PORT (see its own comment). See ops/README.md's Admin panel
  # section for the full two-door auth model (Access + door 2 — a verified Access JWT primarily,
  # the ADMIN_TOKEN bearer check as a fallback — both baked into the panel itself).
  admin:
    build:
      context: ${ADMIN_BUILD_CONTEXT:-./ops/admin}
    container_name: ${BOT_OPS_CONTAINER:-warbandeer-discord}-admin
    # Deliberately NOT `env_file: ${BOT_ENV_FILE:-.env}` like the bot service — that would load
    # every secret in the instance's .env (DISCORD_TOKEN, BLIZZARD_CLIENT_SECRET, GITHUB_TOKEN,
    # CLOUDFLARE_TUNNEL_TOKEN) into this container's process environment wholesale, even though
    # server.ts only ever reads ADMIN_TOKEN, CLOUDFLARE_ACCESS_TEAM_DOMAIN/CLOUDFLARE_ACCESS_AUD,
    # and ADMIN_ALLOWED_EMAILS — directly undermining the whole point of bot-ops.sh's own
    # whitelist, which deliberately excludes secrets. Those four are instead named explicitly
    # below and resolved through compose's own interpolation (which needs them exported into the
    # invoking shell first — see ops/install.sh's printed command), so only those values ever
    # reach this container, not the rest of the file.
    #
    # BOT_OPS_CONFIG_DIR/BOT_OPS_COMPOSE_FILE deliberately use a plain `:-` default here, NOT
    # `:?required` — compose interpolates and validates every service in the file up front,
    # regardless of which --profile is active, so a `:?` on this service would break a plain
    # `docker compose up -d --build` for the *bot* service too (verified: it does, immediately,
    # with no --profile admin in sight). An empty default instead surfaces as a "no such file or
    # directory" error from bot-ops.sh's own `[ -f ... ] || die` checks (its `main()` guard) if
    # `admin` is ever actually started without these set — Docker itself auto-creates a missing
    # bind-mount directory rather than erroring, so the failure is bot-ops.sh's, not Docker's —
    # but it's still a clean, immediate 502 rather than a crash, and only when this profile is
    # the one being brought up.
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      - CLOUDFLARE_ACCESS_AUD=${CLOUDFLARE_ACCESS_AUD:-}
      - ADMIN_ALLOWED_EMAILS=${ADMIN_ALLOWED_EMAILS:-}
      - BOT_OPS_CONFIG_DIR=${BOT_OPS_CONFIG_DIR:-}
      - BOT_OPS_COMPOSE_FILE=${BOT_OPS_COMPOSE_FILE:-}
      - BOT_OPS_PROJECT=${BOT_OPS_PROJECT:-warbandeer-discord-debug}
      - BOT_OPS_CONTAINER=${BOT_OPS_CONTAINER:-warbandeer-discord}
    volumes:
      # Root-equivalent on the host, same accepted tradeoff as the bot service's own socket
      # mount above — it's the only way this panel can shell out to `docker compose` at all.
      - /var/run/docker.sock:/var/run/docker.sock
      # Host-path == container-path throughout, so the BOT_OPS_* values above resolve
      # identically on both sides of the mount — same convention Dockge itself relies on.
      - ${BOT_OPS_CONFIG_DIR:-/nonexistent-set-BOT_OPS_CONFIG_DIR}:${BOT_OPS_CONFIG_DIR:-/nonexistent-set-BOT_OPS_CONFIG_DIR}
      - ${BOT_OPS_COMPOSE_FILE:-/nonexistent-set-BOT_OPS_COMPOSE_FILE}:${BOT_OPS_COMPOSE_FILE:-/nonexistent-set-BOT_OPS_COMPOSE_FILE}:ro
      # The shared, always-current bot-ops.sh — never a copy baked into this image, so a
      # `bin/bot-ops.sh` update (ops/install.sh re-run) takes effect without rebuilding this.
      - /opt/rackbops-discord-bot/bin:/opt/rackbops-discord-bot/bin:ro
    restart: unless-stopped
    profiles:
      - admin

  # Opt-in: exposes the bot's local API (the Warbandeer character-linking endpoint,
  # WARBANDEER_INGEST_PORT — see README's "Character linking" section) to the internet
  # without opening inbound firewall ports. TUNNEL_TOKEN below is Compose interpolation, not
  # env_file: — same mechanism as the admin service's secrets above — so CLOUDFLARE_TUNNEL_TOKEN
  # must be exported into the invoking shell (out of $CONFIG_DIR/.env; see ops/install.sh's
  # printed instructions), not just set "in .env" generically. Start with:
  #   docker compose --profile tunnel up -d --build
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${BOT_OPS_CONTAINER:-warbandeer-discord}-tunnel
    command: tunnel --no-autoupdate run
    environment:
      # :- default: a profile-gated service is still fully interpolated regardless of which
      # --profile is active (see the admin service's own comment above), so an unset token must
      # resolve to empty rather than trip Compose's undefined-variable warning on every
      # unrelated `docker compose` invocation.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - bot
    profiles:
      - tunnel

volumes:
  state:
